<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>算数シューティングゲーム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ゲーム画面専用の追加スタイル */
        body {
            background: #000;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #hiddenVideo {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .game-info {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem;
            border-radius: 10px;
            z-index: 50;
            backdrop-filter: blur(10px);
            text-align: right;
        }

        .game-info .grade-badge {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ranking {
            color: white;
            margin: 2rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            min-width: 300px;
        }

        .ranking-item {
            padding: 0.5rem;
            margin: 0.5rem 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        /* HUD スタイル */
        #hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 95%;
            max-width: 800px;
            color: white;
        }

        #hud.hidden {
            display: none;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
            gap: 0.3rem;
        }

        .hud-row.compact {
            justify-content: space-around;
            flex-wrap: nowrap;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.8);
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hud-item.small {
            padding: 0.3rem 0.5rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .question-display {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 1.6rem;
            text-align: center;
            margin: 0.3rem auto;
            max-width: 85%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-weight: bold;
            backdrop-filter: blur(8px);
        }

        .question-display.compact {
            padding: 0.5rem 0.8rem;
            font-size: 1.4rem;
            margin: 0.2rem auto;
        }

        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <!-- ゲームキャンバス -->
    <canvas id="gameCanvas"></canvas>
    <video id="hiddenVideo" playsinline autoplay></video>

    <!-- HUD (ヘッドアップディスプレイ) -->
    <div id="hud" class="hidden">
        <div class="hud-row compact">
            <div class="hud-item small" id="worldDisplay">🌲</div>
            <div class="hud-item small" id="stageDisplay">1-1</div>
            <div class="hud-item small" id="questionCount">1/8</div>
            <div class="hud-item small" id="playerScore">0</div>
            <div class="hud-item small" id="timeDisplay">60</div>
            <div class="hud-item small" id="eventDisplay" style="display:none;">✨</div>
        </div>
        <div class="question-display compact" id="questionDisplay">?</div>
    </div>

    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="loading"></div>
        <h1>読み込み中...</h1>
        <p id="loadingText">初期化しています...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- 開始オーバーレイ -->
    <div id="startOverlay" class="overlay">
        <h1>🎯 算数シューティングゲーム</h1>
        <p id="welcomeText">カメラを使って手で風船を撃とう！</p>
        <p style="color: #888; font-size: 0.9rem;">※ カメラへのアクセスを許可してください</p>
        <button class="btn" onclick="requestStart()">ゲームスタート</button>
    </div>

    <!-- ゲームオーバーオーバーレイ -->
    <div id="gameOverOverlay" class="overlay hidden">
        <h1>ゲームオーバー</h1>
        <div class="ranking" id="gameOverStats"></div>
        <div class="btn-group">
            <button class="btn" onclick="restartGame()">もう一度</button>
            <button class="btn btn-secondary" onclick="goBack()">学年選択に戻る</button>
        </div>
    </div>

    <!-- 結果オーバーレイ -->
    <div id="rankingOverlay" class="overlay hidden">
        <h1>結果発表</h1>
        <div class="ranking" id="rankingDisplay"></div>
        <div class="btn-group">
            <button class="btn" onclick="nextRound()">次のラウンド</button>
            <button class="btn btn-secondary" onclick="goBack()">学年選択に戻る</button>
        </div>
    </div>

    <!-- エラーオーバーレイ -->
    <div id="errorOverlay" class="overlay hidden">
        <h1>エラー</h1>
        <p id="errorMessage" style="color: #ff4444; margin: 2rem 0;">エラーが発生しました</p>
        <div class="btn-group">
            <button class="btn" onclick="location.reload()">再読み込み</button>
            <button class="btn btn-secondary" onclick="goBack()">学年選択に戻る</button>
        </div>
    </div>

    <!-- 戻るボタン（右下） -->
    <button class="back-btn-bottom" onclick="goBack()">← 戻る</button>

    <!-- 外部ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <!-- 問題データ -->
    <script src="questions.js"></script>

    <!-- ゲームロジック -->
    <script src="game.js"></script>

    <script>
        // 学年選択から戻る
        function goBack() {
            window.location.href = 'index.html';
        }

        // 学年情報を表示
        function displayGradeInfo() {
            const selectedGrade = localStorage.getItem('selectedGrade') || '1';
            const curriculum = GRADE_CURRICULUMS[selectedGrade];

            if (curriculum) {
                const welcomeText = document.getElementById('welcomeText');
                if (welcomeText) {
                    welcomeText.textContent = `${curriculum.name}の問題に挑戦しよう！ ${curriculum.description}`;
                }
            }
        }

        // ページロード時に学年情報を表示
        window.addEventListener('DOMContentLoaded', displayGradeInfo);
    </script>
</body>
</html>
