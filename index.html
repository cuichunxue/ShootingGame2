<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>算数シューティングゲーム - 学年選択</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- メイン画面 (学年選択) -->
    <div class="main-screen" id="mainScreen">
        <h1 class="main-title">🎯 算数シューティングゲーム</h1>
        <p class="main-subtitle">学年を選んでゲームを始めよう！</p>

        <div class="grade-selection" id="gradeSelection">
            <button class="grade-btn" data-grade="1">
                <div class="grade-emoji">🌱</div>
                <div class="grade-name">1年生</div>
                <div class="grade-desc">たし算・ひき算</div>
            </button>

            <button class="grade-btn" data-grade="2">
                <div class="grade-emoji">🌿</div>
                <div class="grade-name">2年生</div>
                <div class="grade-desc">九九と3桁の計算</div>
            </button>

            <button class="grade-btn" data-grade="3">
                <div class="grade-emoji">🌳</div>
                <div class="grade-name">3年生</div>
                <div class="grade-desc">かけ算・わり算</div>
            </button>

            <button class="grade-btn" data-grade="4">
                <div class="grade-emoji">🌲</div>
                <div class="grade-name">4年生</div>
                <div class="grade-desc">小数・分数と面積</div>
            </button>

            <button class="grade-btn" data-grade="5">
                <div class="grade-emoji">🏔️</div>
                <div class="grade-name">5年生</div>
                <div class="grade-desc">分数と体積</div>
            </button>

            <button class="grade-btn" data-grade="6">
                <div class="grade-emoji">🎓</div>
                <div class="grade-name">6年生</div>
                <div class="grade-desc">比・速さ・比例</div>
            </button>
        </div>

        <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; text-align: center; max-width: 600px; line-height: 1.6;">
            手を使って風船を撃って、算数の問題に答えよう！<br>
            正解すると点数がもらえるよ。楽しく算数を学ぼう！
        </p>
    </div>

    <script>
        // 学年選択のイベントリスナー
        document.querySelectorAll('.grade-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const grade = this.getAttribute('data-grade');
                // 選択された学年をローカルストレージに保存
                localStorage.setItem('selectedGrade', grade);
                // ゲーム画面に遷移
                window.location.href = 'game.html';
            });
        });

        // エンターキーでも動作するようにアクセシビリティを向上
        document.querySelectorAll('.grade-btn').forEach(btn => {
            btn.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });
    </script>
</body>
</html>
